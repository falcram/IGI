{% extends "base.html" %}
{% block title %}Vacancy{% endblock title %}
{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/vacancies.css' %}">

<h1>Вакансии</h1>
    {% for vac in vacancies %}
        <div class="job">
            <h2>{{ vac.name }}</h2>
            <p>{{ vac.description }}</p>
            <p>{{ vac.need }}</p>
        </div>
    {% endfor %}
    <div style="clear: both;"></div>
{% endblock content %}
